############################# About ###################################
about:
  enable : true
  title : About Us
  about_item :
  - icon : ti-user # Ícone de utilizador/estudante
    title : Engineer Students
    content : We are seniors in the Electrical and Computer Engineering program at the Instituto Superior Técnico (IST). We were assigned this challenge as our final undergraduate project, which we will be working on during this last semester.

  - icon : ti-pie-chart # Ícone de estatística/gráfico
    title : Portugal's Reality
    content : It is estimated that there are approximately 160,000 people with visual impairments in our country, of whom more than 25,000 are completely blind. These figures highlight the urgent need to develop technological solutions to support mobility.

  - icon : ti-target # Ícone de alvo/missão
    title : Our Goal
    content : Our goal with this project is to explore a technological solution for people who are blind or have low vision. We aim to raise awareness of the challenges these individuals face in their daily lives.